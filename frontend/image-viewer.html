<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera event image</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111; color: #eee; }
    img { display: block; max-width: 100vw; max-height: 100vh; object-fit: contain; }
    p { padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <p id="status">Loading image…</p>
  <script>
    (async () => {
      const status = document.querySelector("#status");
      const id = new URLSearchParams(location.search).get("id");
      const token = localStorage.getItem("verifeye_token");
      if (!/^\d+$/.test(id || "")) { status.textContent = "Invalid screenshot link."; return; }
      if (!token) { status.textContent = "Your session has expired. Return to VerifEye and sign in again."; return; }
      try {
        const response = await fetch(`/api/screenshots/${id}`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        if (!response.ok) {
          let message = "The event image could not be loaded.";
          try { message = (await response.json()).detail || message; } catch (_) {}
          throw new Error(message);
        }
        const objectUrl = URL.createObjectURL(await response.blob());
        const image = document.createElement("img");
        image.alt = "Camera event image";
        image.src = objectUrl;
        status.replaceWith(image);
        addEventListener("pagehide", () => URL.revokeObjectURL(objectUrl), { once: true });
      } catch (error) {
        status.textContent = error.message;
      }
    })();
  </script>
</body>
</html>
